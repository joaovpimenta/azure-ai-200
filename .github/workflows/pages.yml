name: Build and deploy Azure AI-200 Study Hub to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!.github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-audio:
    uses: ./.github/workflows/kokoro-audio.yml

  validate-and-build:
    needs: generate-audio
    name: Validate and build static artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install toolchain dependencies
        run: npm ci

      - name: Run deterministic validation gate
        run: npm run validate

      - name: Build production HTML artifact in dist/
        run: npm run build

      - name: Run full automated test suite against built artifact
        run: npm test

      - name: Download verified audio for this build
        uses: actions/download-artifact@v4
        with:
          name: narration-audio
          path: dist/audio

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Verify every article has current audio before publishing
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python tools/tts/kokoro_release.py verify --catalog dist/data/catalog.json --output-dir dist/audio

      - name: Upload validated site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: validate-and-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
