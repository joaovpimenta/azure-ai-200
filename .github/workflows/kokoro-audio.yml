name: Generate Kokoro Narration Audio (pf_dora)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug de um artigo ou all para gerar todos"
        default: "all"
        type: string
      voice:
        description: "Voz em português"
        default: "pf_dora"
        type: string
      speed:
        description: "Velocidade de síntese (0.5 a 2.0)"
        default: "1.0"
        type: string
  workflow_call:
    inputs:
      slug:
        default: "all"
        type: string
      voice:
        default: "pf_dora"
        type: string
      speed:
        default: "1.0"
        type: string
  pull_request:
    branches: [main]
    paths:
      - "chapters/**"
      - "comparisons/**"
      - "tools/tts/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/kokoro-audio.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TTS_SLUG: ${{ inputs.slug || 'all' }}
      TTS_VOICE: ${{ inputs.voice || 'pf_dora' }}
      TTS_SPEED: ${{ inputs.speed || '1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/tts/requirements.txt
      - name: Build current narration catalog
        run: |
          npm ci
          npm run validate
          npm run build
      - name: Install synthesis and MP3 tools
        run: |
          python -m pip install -r tools/tts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Cache pinned model files
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-model-v1.1-${{ hashFiles('tools/tts/download_models.py') }}
      - name: Download and verify model files
        run: python tools/tts/download_models.py
      - name: Restore previously synthesized articles
        uses: actions/cache/restore@v4
        with:
          path: tools/tts/output
          key: tts-${{ runner.os }}-${{ hashFiles('tools/tts/*.py', 'tools/tts/requirements.txt') }}-${{ hashFiles('dist/data/catalog.json') }}-${{ env.TTS_SLUG }}-${{ env.TTS_VOICE }}-${{ env.TTS_SPEED }}
          restore-keys: |
            tts-${{ runner.os }}-${{ hashFiles('tools/tts/*.py', 'tools/tts/requirements.txt') }}-
      - name: Synthesize real MP3 files and measure chapter times
        run: |
          python tools/tts/kokoro_release.py synthesize \
            --catalog dist/data/catalog.json --slug "$TTS_SLUG" \
            --voice "$TTS_VOICE" --speed "$TTS_SPEED" \
            --model .cache/kokoro/kokoro-v1.0.onnx \
            --voices .cache/kokoro/voices-v1.0.bin \
            --output-dir tools/tts/output
      - name: Require complete and current audio coverage
        run: |
          python tools/tts/kokoro_release.py verify \
            --catalog dist/data/catalog.json --slug "$TTS_SLUG" \
            --voice "$TTS_VOICE" --speed "$TTS_SPEED" \
            --output-dir tools/tts/output
      - name: Save verified audio cache
        uses: actions/cache/save@v4
        with:
          path: tools/tts/output
          key: tts-${{ runner.os }}-${{ hashFiles('tools/tts/*.py', 'tools/tts/requirements.txt') }}-${{ hashFiles('dist/data/catalog.json') }}-${{ env.TTS_SLUG }}-${{ env.TTS_VOICE }}-${{ env.TTS_SPEED }}
      - name: Upload MP3 files, measured chapters and coverage manifest
        uses: actions/upload-artifact@v4
        with:
          name: narration-audio
          path: tools/tts/output/
          if-no-files-found: error
          retention-days: 14
